name: Wiped-ESP registration
description: Your T1 shows as 05ac:1281 (recovery) and EFI/APPLE is gone. Register before running anything.
title: "[MacBookProXX,Y] recovery: wiped ESP registration"
labels: ["wiped-esp"]
body:
  - type: markdown
    attributes:
      value: |
        You are who this tool is for. Register first; the reply tells you which version to use
        and what to read before you type the first command. Do not attempt a recovery from
        fragments, gists, or another Mac's files while you wait.

        **Never paste:** serial numbers, ECIDs, nonces, tickets, the contents of any file under
        `EFI/APPLE`, `/var/lib/t1-revive` or `/var/lib/t1bridge`, keybags, calibration, biometric
        state, full journals, `dmesg`, `lsusb -v`, hostnames, usernames, home paths, IP or MAC
        addresses, or screenshots showing any of these.
  - type: dropdown
    id: model
    attributes:
      label: Model
      description: "`cat /sys/class/dmi/id/product_name`"
      options:
        - MacBookPro13,2 (2016 13-inch)
        - MacBookPro13,3 (2016 15-inch)
        - MacBookPro14,2 (2017 13-inch)
        - MacBookPro14,3 (2017 15-inch)
        - other (say which below)
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and version
      placeholder: "Omarchy 4.0.2 / Arch (2026-09) / other"
    validations:
      required: true
  - type: dropdown
    id: usb
    attributes:
      label: What `lsusb | grep 05ac` shows for the T1
      options:
        - "05ac:1281 (recovery)"
        - "05ac:8600 (booted)"
        - neither
    validations:
      required: true
  - type: input
    id: how
    attributes:
      label: How the EFI data got wiped
      placeholder: "Omarchy full-disk install / manual repartition / unknown"
  - type: dropdown
    id: backup
    attributes:
      label: Did a copy of EFI/APPLE from this Mac ever exist anywhere (old backup, Time Machine, disk image)?
      options:
        - "yes, and I still have it"
        - "yes, but it is gone"
        - "no"
        - not sure
    validations:
      required: true
  - type: dropdown
    id: macos
    attributes:
      label: Is macOS still installed anywhere on this Mac?
      options:
        - "yes"
        - "no"
        - not sure
    validations:
      required: true
  - type: dropdown
    id: willing
    attributes:
      label: Willing to run the guarded recovery on your own machine, backup first, guided by the docs and the tester skill?
      options:
        - "yes, now"
        - "yes, later"
        - "no, registering only"
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: t1-revive report bundle (optional)
      description: If you already installed the tool, `sudo t1-revive report --out t1-revive-report.txt`, read it, paste it whole. Running `report` touches nothing.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      placeholder: Timezone for asynchronous replies, or what you already tried before finding this repo.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This issue contains no serial numbers, ECIDs, nonces, tickets, file contents from EFI/APPLE, keybags, hostnames, usernames, paths, or addresses.
          required: true
        - label: I have not run any recovery step yet and will not run one from fragments.
          required: true
