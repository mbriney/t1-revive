name: Intact-ESP report
description: EFI/APPLE is present on your Mac. Report how the Touch Bar / Touch ID stack (t1bridge) behaved, with or without t1-revive.
title: "[MacBookProXX,Y] booted: <one line>"
labels: ["intact-esp"]
body:
  - type: markdown
    attributes:
      value: |
        Your machine never needed a regeneration. Your report still matters: it tells us what
        "working" looks like on your model, and whether `t1-revive status`, `preflight` and
        `report` read an intact machine correctly.

        **Never paste:** serial numbers, ECIDs, nonces, tickets, the contents of any file under
        `EFI/APPLE`, `/var/lib/t1-revive` or `/var/lib/t1bridge`, keybags, calibration, biometric
        state, full journals, `dmesg`, `lsusb -v`, hostnames, usernames, home paths, IP or MAC
        addresses, or screenshots showing any of these.
  - type: dropdown
    id: model
    attributes:
      label: Model
      description: "`cat /sys/class/dmi/id/product_name`"
      options:
        - MacBookPro13,2 (2016 13-inch)
        - MacBookPro13,3 (2016 15-inch)
        - MacBookPro14,2 (2017 13-inch)
        - MacBookPro14,3 (2017 15-inch)
        - other (say which below)
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and version
      placeholder: "Omarchy 4.0.2 / Arch (2026-09) / other"
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: "`uname -r`"
    validations:
      required: true
  - type: textarea
    id: packages
    attributes:
      label: Packages
      description: "`pacman -Q t1bridge t1bridge-dkms libfprint-t1bridge fprintd-t1bridge`"
      render: text
  - type: dropdown
    id: stage1
    attributes:
      label: t1bridge install (packages, services, DKMS modules)
      options:
        - ok
        - failed
        - not attempted
    validations:
      required: true
  - type: dropdown
    id: powercycle
    attributes:
      label: Full power cycle after the t1bridge install (shutdown, not reboot)?
      options:
        - "yes"
        - "no"
        - handover without power cycle
  - type: dropdown
    id: stage2
    attributes:
      label: Bring-up (renderer, firewall rule, import, enroll, PAM)
      options:
        - ok
        - failed
        - not attempted
        - not reached
    validations:
      required: true
  - type: checkboxes
    id: results
    attributes:
      label: What works (tick what you verified yourself)
      options:
        - label: Touch Bar lit at boot
        - label: "`sudo t1bridge status` all ready"
        - label: Import (automatic or explicit path)
        - label: Enroll (first attempt or after the one documented retry)
        - label: Verify
        - label: sudo by touch
        - label: sudo password fallback
        - label: Lock screen by touch
        - label: Lock screen password
        - label: Survives reboot without re-enrolling
        - label: Camera
  - type: textarea
    id: bundle
    attributes:
      label: t1-revive report bundle
      description: "`sudo t1-revive report --out t1-revive-report.txt`, read it, paste it whole. If t1-revive is not installed, paste `t1bridge-diagnostic` lines only."
      render: text
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: On failure, what happened
      description: The step, the message, and only `t1bridge-diagnostic` / `t1-revive-diagnostic` lines.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I read the bundle and this issue contains no serial numbers, ECIDs, nonces, tickets, file contents from EFI/APPLE, keybags, hostnames, usernames, paths, or addresses.
          required: true
        - label: Password login for sudo and the lock screen was tested and still works.
          required: false
  - type: dropdown
    id: credit
    attributes:
      label: If this confirms a model, may we list your GitHub handle in the README table?
      options:
        - "yes"
        - "no"
