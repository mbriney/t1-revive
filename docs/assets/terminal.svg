  <circle cx="80" cy="24" r="7" fill="#3ee8a8"/>
  <text x="640" y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#8b93c2">t1-revive  ·  regenerate</text>
  <text x="36" y="92" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#e8ecff" font-variant-ligatures="none">$ sudo t1-revive regenerate</text><text x="36" y="124" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3ee8a8" font-variant-ligatures="none">====  preflight</text><text x="36" y="146" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b7c0e6" font-variant-ligatures="none">   model: MacBookPro14,3 (tested)</text><text x="36" y="168" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b7c0e6" font-variant-ligatures="none">   firmware bundle OK · patched tools OK</text><text x="36" y="190" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b7c0e6" font-variant-ligatures="none">   no EFI/APPLE/EMBEDDEDOS on the ESP</text><text x="36" y="212" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#b7c0e6" font-variant-ligatures="none">   T1 now: 1281   start: provision</text><text x="36" y="244" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#ffc46b" font-variant-ligatures="none">   ?  start the regeneration at 'provision'</text><text x="36" y="266" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#6b7394" font-variant-ligatures="none">     Press Enter to continue, or Ctrl-C to stop.</text><text x="36" y="298" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3ee8a8" font-variant-ligatures="none">====  Step 1 of 4: the T1 asks Apple for its own data</text><text x="36" y="320" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#9aa3c7" font-variant-ligatures="none">   FDRData ready</text><text x="36" y="342" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3ee8a8" font-variant-ligatures="none">====  Step 2 of 4: personalising the T1's boot image</text><text x="36" y="364" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#9aa3c7" font-variant-ligatures="none">   image + ticket captured</text><text x="36" y="386" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3ee8a8" font-variant-ligatures="none">====  Step 3 of 4: booting the T1</text><text x="36" y="408" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#9aa3c7" font-variant-ligatures="none">   T1 at 8600 · watch the Touch Bar</text><text x="36" y="430" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3ee8a8" font-variant-ligatures="none">====  Step 4 of 4: making it permanent</text><text x="36" y="452" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#9aa3c7" font-variant-ligatures="none">   staged EFI/APPLE/EMBEDDEDOS · handover to t1bridge</text><text x="36" y="484" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#3ee8a8" font-variant-ligatures="none">====  regenerate complete. T1: 8600</text><text x="36" y="506" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3ee8a8" font-variant-ligatures="none">   4 min 8 s · no reboot</text>
